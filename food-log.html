<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日飲食紀錄表</title>
  <meta name="description" content="簡單好用的每日飲食紀錄表，快速統計今天吃了什麼。">
  <style>
    :root {
      --bg: #f6f5f0;
      --card: #ffffff;
      --ink: #2f2f2f;
      --muted: rgba(47, 47, 47, 0.55);
      --accent: #ff8a00;
      --radius: 14px;
      --shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: "Noto Serif TC", "Noto Serif", serif;
      margin: 0 0 0.5em;
    }

    a {
      color: inherit;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    .panel {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px 16px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
    }

    input[type="date"],
    input[type="time"],
    input[type="number"],
    select,
    textarea {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(47, 47, 47, 0.2);
      font: inherit;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 138, 0, 0.15);
      outline: none;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    button {
      font: inherit;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 12px 20px rgba(255, 138, 0, 0.22);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 24px rgba(255, 138, 0, 0.28);
    }

    .btn-text {
      background: transparent;
      color: var(--muted);
      padding-inline: 12px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .summary-card {
      border-radius: 12px;
      padding: 14px 16px;
      background: #fff4e6;
      border: 1px solid rgba(255, 138, 0, 0.25);
      display: grid;
      gap: 4px;
    }

    .summary-card span {
      font-size: 13px;
      color: var(--muted);
    }

    .summary-card strong {
      font-size: 20px;
    }

    .log {
      display: grid;
      gap: 18px;
    }

    details {
      background: var(--card);
      border-radius: var(--radius);
      padding: 0;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    details[open] summary::after {
      transform: rotate(180deg);
    }

    summary {
      list-style: none;
      cursor: pointer;
      padding: 18px 22px;
      font-weight: 600;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "⌄";
      font-size: 18px;
      color: var(--muted);
      transition: transform 0.2s ease;
    }

    .day-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    ul.entries {
      margin: 0;
      padding: 0 22px 22px;
      list-style: none;
      display: grid;
      gap: 14px;
    }

    .entry {
      border: 1px solid rgba(47, 47, 47, 0.15);
      border-radius: 12px;
      padding: 14px 16px;
      display: grid;
      gap: 6px;
      position: relative;
    }

    .entry .meal {
      font-weight: 600;
      font-size: 15px;
    }

    .entry .content {
      white-space: pre-wrap;
    }

    .entry .meta {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .entry button.delete {
      position: absolute;
      right: 12px;
      top: 12px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid rgba(47, 47, 47, 0.2);
    }

    .entry button.delete:hover {
      color: #c44536;
      border-color: rgba(196, 69, 54, 0.4);
    }

    .empty {
      padding: 18px 22px 22px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 24px 16px 48px;
      }

      summary {
        flex-direction: column;
        align-items: flex-start;
      }

      .day-meta {
        width: 100%;
      }

      .entry button.delete {
        position: static;
        margin-left: auto;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>每日飲食紀錄表</h1>
      <p>用簡單的表單記下今天吃了什麼，系統會自動幫你算出每一天的餐數與熱量。資料只會保存在你的裝置裡。</p>
    </header>

    <section class="panel" aria-labelledby="log-form-title">
      <div>
        <h2 id="log-form-title">新增餐點</h2>
        <p class="muted">輸入餐別、內容與熱量（若不確定可留白），就能即時更新清單。</p>
      </div>
      <form id="log-form">
        <div class="form-grid">
          <label>
            日期
            <input type="date" id="date" required>
          </label>
          <label>
            餐別
            <select id="meal" required>
              <option value="早餐">早餐</option>
              <option value="午餐">午餐</option>
              <option value="晚餐">晚餐</option>
              <option value="點心">點心</option>
              <option value="飲品">飲品</option>
            </select>
          </label>
          <label>
            用餐時間
            <input type="time" id="time">
          </label>
          <label>
            熱量（大卡，可選填）
            <input type="number" id="calories" min="0" step="1" placeholder="例如：520">
          </label>
        </div>
        <label>
          內容描述
          <textarea id="content" placeholder="今天吃了什麼呢？" required></textarea>
        </label>
        <div class="actions">
          <button type="reset" class="btn-text" id="reset-btn">清空</button>
          <button type="submit" class="btn-primary">加入清單</button>
        </div>
      </form>

      <div class="summary" aria-live="polite">
        <div class="summary-card">
          <span>今天共記錄餐點</span>
          <strong id="summary-count">0</strong>
          <span>筆</span>
        </div>
        <div class="summary-card">
          <span>今日熱量估計</span>
          <strong id="summary-calories">0</strong>
          <span>大卡</span>
        </div>
      </div>
    </section>

    <section class="log" aria-labelledby="log-list-title">
      <h2 id="log-list-title">飲食清單</h2>
      <div id="log-container" aria-live="polite"></div>
    </section>
  </div>

  <template id="log-template">
    <details>
      <summary>
        <span class="date"></span>
        <div class="day-meta">
          <span class="count"></span>
          <span class="calories"></span>
        </div>
      </summary>
      <ul class="entries"></ul>
    </details>
  </template>

  <template id="entry-template">
    <li class="entry">
      <button type="button" class="delete" aria-label="刪除這筆紀錄">刪除</button>
      <div class="meal"></div>
      <div class="content"></div>
      <div class="meta"></div>
    </li>
  </template>

  <script>
    const storageKey = 'rq-food-log.v1';

    const createId = () => {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    };

    /** @type {Array<{id:string,date:string,meal:string,time:string,content:string,calories:number|null,createdAt:number}>} */
    let entries = [];

    const $ = (selector, scope = document) => scope.querySelector(selector);
    const form = $('#log-form');
    const dateInput = $('#date');
    const mealInput = $('#meal');
    const timeInput = $('#time');
    const contentInput = $('#content');
    const caloriesInput = $('#calories');
    const summaryCount = $('#summary-count');
    const summaryCalories = $('#summary-calories');
    const logContainer = $('#log-container');
    const logTemplate = $('#log-template');
    const entryTemplate = $('#entry-template');

    const formatNumber = (num) => num.toLocaleString('zh-TW');

    function todayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      return local.toISOString().split('T')[0];
    }

    function loadEntries() {
      try {
        const raw = localStorage.getItem(storageKey);
        entries = raw ? JSON.parse(raw) : [];
      } catch (error) {
        console.warn('讀取資料失敗，重新初始化', error);
        entries = [];
      }
    }

    function saveEntries() {
      localStorage.setItem(storageKey, JSON.stringify(entries));
    }

    function resetForm() {
      form.reset();
      dateInput.value = todayISO();
      mealInput.value = '早餐';
      timeInput.value = '';
      caloriesInput.value = '';
      contentInput.focus();
    }

    function addEntry(data) {
      entries.push({
        id: createId(),
        createdAt: Date.now(),
        ...data
      });
      entries.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.createdAt - b.createdAt));
      saveEntries();
      render();
    }

    function deleteEntry(id) {
      entries = entries.filter((entry) => entry.id !== id);
      saveEntries();
      render();
    }

    function groupByDate() {
      const map = new Map();
      for (const entry of entries) {
        if (!map.has(entry.date)) {
          map.set(entry.date, []);
        }
        map.get(entry.date).push(entry);
      }
      return Array.from(map.entries()).sort(([a], [b]) => (a < b ? 1 : -1));
    }

    function renderSummary() {
      const today = todayISO();
      const todayEntries = entries.filter((entry) => entry.date === today);
      const count = todayEntries.length;
      const calories = todayEntries.reduce((sum, entry) => sum + (entry.calories ?? 0), 0);
      summaryCount.textContent = formatNumber(count);
      summaryCalories.textContent = formatNumber(calories);
    }

    function renderList() {
      logContainer.innerHTML = '';
      const grouped = groupByDate();

      if (!grouped.length) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = '目前還沒有任何紀錄，先在上方填寫第一筆吧！';
        logContainer.appendChild(empty);
        return;
      }

      for (const [date, items] of grouped) {
        const node = logTemplate.content.firstElementChild.cloneNode(true);
        const dateSpan = $('.date', node);
        const countSpan = $('.count', node);
        const caloriesSpan = $('.calories', node);
        const list = $('.entries', node);

        const totalCalories = items.reduce((sum, item) => sum + (item.calories ?? 0), 0);
        const formatter = new Intl.DateTimeFormat('zh-TW', { dateStyle: 'full' });
        const dateLabel = formatter.format(new Date(date + 'T00:00:00'));

        dateSpan.textContent = dateLabel;
        countSpan.textContent = `共 ${items.length} 筆`;
        caloriesSpan.textContent = `約 ${formatNumber(totalCalories)} 大卡`;

        for (const item of items) {
          const entryNode = entryTemplate.content.firstElementChild.cloneNode(true);
          const mealEl = $('.meal', entryNode);
          const contentEl = $('.content', entryNode);
          const metaEl = $('.meta', entryNode);
          const deleteBtn = $('.delete', entryNode);

          mealEl.textContent = `${item.meal}${item.time ? `｜${item.time}` : ''}`;
          contentEl.textContent = item.content;

          const metaTexts = [];
          if (item.calories != null && item.calories !== '') {
            metaTexts.push(`熱量 ${formatNumber(item.calories)} 大卡`);
          }
          const createdAt = new Date(item.createdAt);
          metaTexts.push(`紀錄於 ${createdAt.toLocaleString('zh-TW')}`);
          metaEl.textContent = metaTexts.join('｜');

          deleteBtn.addEventListener('click', () => {
            if (confirm('確定要刪除這筆紀錄嗎？')) {
              deleteEntry(item.id);
            }
          });

          list.appendChild(entryNode);
        }

        if (date === dateInput.value) {
          node.setAttribute('open', '');
        }

        logContainer.appendChild(node);
      }
    }

    function render() {
      renderSummary();
      renderList();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const data = {
        date: dateInput.value,
        meal: mealInput.value,
        time: timeInput.value,
        content: contentInput.value.trim(),
        calories: caloriesInput.value ? Number(caloriesInput.value) : null,
      };

      addEntry(data);
      resetForm();
    });

    $('#reset-btn').addEventListener('click', () => {
      resetForm();
      renderSummary();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadEntries();
        render();
      }
    });

    loadEntries();
    dateInput.value = todayISO();
    render();
  </script>
</body>
</html>
