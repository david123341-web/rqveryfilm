<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube 封面自動生成器</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-soft: #1f2937;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #ef4444;
      --primary-2: #f97316;
      --radius: 14px;
      --shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(1200px 600px at 10% 10%, #1d4ed8 0%, transparent 55%),
                  radial-gradient(800px 500px at 90% 20%, #be123c 0%, transparent 50%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
      grid-template-columns: 340px 1fr;
    }

    @media (max-width: 980px) {
      .container { grid-template-columns: 1fr; }
    }

    .panel {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .controls { padding: 18px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    .intro { color: var(--muted); margin: 0 0 16px; font-size: 14px; }

    .field { margin-bottom: 14px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5e1; }

    input[type="text"], input[type="file"], textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }

    textarea { resize: vertical; min-height: 72px; }

    .inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input[type="range"] { width: 100%; }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      color: white;
      font-weight: 600;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
    }

    button.secondary {
      background: #334155;
    }

    .preview {
      padding: 18px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    canvas {
      width: 100%;
      max-width: 960px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0b1020;
      aspect-ratio: var(--canvas-ratio, 16 / 9);
      display: block;
    }

    .tips {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0b1220;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: #cbd5e1;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .stats {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="panel controls">
      <h1>🎬 YouTube 封面自動生成器</h1>
      <p class="intro">上傳一張照片，系統會自動裁切成指定畫幅，並套用你設定的文字與視覺效果。</p>

      <div class="field">
        <label for="photoInput">1) 上傳照片</label>
        <input id="photoInput" type="file" accept="image/*" />
      </div>

      <div class="field">
        <label for="aspectRatio">2) 畫幅比例</label>
        <select id="aspectRatio">
          <option value="landscape">16:9（1280 × 720）</option>
          <option value="portrait">9:16（1080 × 1920）</option>
        </select>
      </div>

      <div class="field">
        <label for="titleInput">3) 封面主標題</label>
        <textarea id="titleInput" placeholder="例如：3 招讓影片點閱翻倍">3 招讓影片點閱翻倍</textarea>
      </div>

      <div class="field">
        <label for="subtitleInput">4) 副標題（可選）</label>
        <input id="subtitleInput" type="text" value="新手也能做出專業感封面" />
      </div>

      <div class="inline">
        <div class="field">
          <label for="textColor">文字顏色</label>
          <input id="textColor" type="color" value="#ffffff" />
        </div>
        <div class="field">
          <label for="accentColor">重點色塊</label>
          <input id="accentColor" type="color" value="#ef4444" />
        </div>
      </div>

      <div class="inline">
        <div class="field">
          <label for="brightness">亮度</label>
          <input id="brightness" type="range" min="50" max="160" value="100" />
        </div>
        <div class="field">
          <label for="contrast">對比</label>
          <input id="contrast" type="range" min="60" max="170" value="110" />
        </div>
      </div>

      <div class="inline">
        <div class="field">
          <label for="overlay">暗角遮罩</label>
          <input id="overlay" type="range" min="0" max="80" value="35" />
        </div>
        <div class="field">
          <label for="layout">版型</label>
          <select id="layout">
            <option value="left">左下文案</option>
            <option value="center">中央大字</option>
            <option value="right">右側文案</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="randomBtn" class="secondary" type="button">隨機靈感</button>
        <button id="downloadBtn" type="button">下載封面 PNG</button>
      </div>
    </section>

    <section class="panel preview">
      <div>
        <span id="sizePill" class="pill">尺寸：1280 × 720</span>
        <span class="pill">格式：PNG</span>
        <span id="usagePill" class="pill">用途：YouTube Thumbnail</span>
      </div>
      <canvas id="thumbCanvas" width="1280" height="720" aria-label="YouTube thumbnail preview"></canvas>
      <p id="imageStatus" class="stats">尚未上傳圖片：目前顯示預設背景。</p>
      <p class="tips">小提醒：主標建議 8~18 個字，使用高對比顏色，人物臉部避免被文字遮住。</p>
    </section>
  </main>

  <script>
    const FORMATS = {
      landscape: { width: 1280, height: 720, ratio: '16 / 9', label: '1280 × 720', usage: 'YouTube Thumbnail' },
      portrait: { width: 1080, height: 1920, ratio: '9 / 16', label: '1080 × 1920', usage: 'YouTube Shorts 封面' }
    };

    const canvas = document.getElementById('thumbCanvas');
    const ctx = canvas.getContext('2d');

    const photoInput = document.getElementById('photoInput');
    const aspectRatioInput = document.getElementById('aspectRatio');
    const titleInput = document.getElementById('titleInput');
    const subtitleInput = document.getElementById('subtitleInput');
    const textColorInput = document.getElementById('textColor');
    const accentColorInput = document.getElementById('accentColor');
    const brightnessInput = document.getElementById('brightness');
    const contrastInput = document.getElementById('contrast');
    const overlayInput = document.getElementById('overlay');
    const layoutInput = document.getElementById('layout');
    const randomBtn = document.getElementById('randomBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const imageStatus = document.getElementById('imageStatus');
    const sizePill = document.getElementById('sizePill');
    const usagePill = document.getElementById('usagePill');

    const state = {
      image: null,
      imageName: '',
      format: aspectRatioInput.value,
      title: titleInput.value,
      subtitle: subtitleInput.value,
      textColor: textColorInput.value,
      accentColor: accentColorInput.value,
      brightness: Number(brightnessInput.value),
      contrast: Number(contrastInput.value),
      overlay: Number(overlayInput.value),
      layout: layoutInput.value
    };

    function applyFormat() {
      const format = FORMATS[state.format];
      canvas.width = format.width;
      canvas.height = format.height;
      canvas.style.setProperty('--canvas-ratio', format.ratio);
      sizePill.textContent = `尺寸：${format.label}`;
      usagePill.textContent = `用途：${format.usage}`;
    }

    function drawCoverImage(img) {
      const cw = canvas.width;
      const ch = canvas.height;
      const imageRatio = img.width / img.height;
      const canvasRatio = cw / ch;

      let sx = 0;
      let sy = 0;
      let sw = img.width;
      let sh = img.height;

      if (imageRatio > canvasRatio) {
        sw = img.height * canvasRatio;
        sx = (img.width - sw) / 2;
      } else {
        sh = img.width / canvasRatio;
        sy = (img.height - sh) / 2;
      }

      ctx.filter = `brightness(${state.brightness}%) contrast(${state.contrast}%)`;
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
      ctx.filter = 'none';
    }

    function drawFallbackBackground() {
      const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      g.addColorStop(0, '#0f172a');
      g.addColorStop(0.5, '#1d4ed8');
      g.addColorStop(1, '#be123c');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawOverlay() {
      const intensity = state.overlay / 100;
      const gradient = ctx.createLinearGradient(0, canvas.height, 0, canvas.height * 0.2);
      gradient.addColorStop(0, `rgba(0,0,0,${0.75 * intensity + 0.15})`);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function layoutText() {
      const padding = Math.round(canvas.width * 0.06);
      if (state.layout === 'center') return { x: canvas.width / 2, y: canvas.height * 0.68, align: 'center' };
      if (state.layout === 'right') return { x: canvas.width - padding, y: canvas.height * 0.68, align: 'right' };
      return { x: padding, y: canvas.height * 0.68, align: 'left' };
    }

    function drawMultilineText(text, x, y, maxWidth, lineHeight) {
      const words = text.split('');
      let line = '';
      const lines = [];

      for (const char of words) {
        const test = line + char;
        if (ctx.measureText(test).width > maxWidth && line.length > 0) {
          lines.push(line);
          line = char;
        } else {
          line = test;
        }
      }

      if (line) lines.push(line);

      lines.forEach((item, index) => {
        ctx.strokeText(item, x, y + index * lineHeight);
        ctx.fillText(item, x, y + index * lineHeight);
      });

      return lines.length;
    }

    function drawText() {
      const t = layoutText();
      const isPortrait = canvas.height > canvas.width;
      const maxWidth = isPortrait ? Math.round(canvas.width * 0.84) : Math.round(canvas.width * 0.56);
      const title = state.title.trim() || '你的爆款標題';
      const subtitle = state.subtitle.trim();
      const titleSize = isPortrait ? Math.round(canvas.width * 0.105) : Math.round(canvas.width * 0.061);
      const subtitleSize = isPortrait ? Math.round(canvas.width * 0.052) : Math.round(canvas.width * 0.033);
      const titleLineHeight = Math.round(titleSize * 1.16);

      ctx.textAlign = t.align;
      ctx.lineJoin = 'round';

      const blockWidth = isPortrait ? Math.round(canvas.width * 0.72) : (t.align === 'center' ? 430 : 360);
      const rectX = t.align === 'left' ? t.x - 10 : (t.align === 'right' ? t.x - blockWidth + 10 : t.x - blockWidth / 2);
      const rectY = t.y - Math.round(titleSize * 0.85);
      ctx.fillStyle = `${state.accentColor}d8`;
      ctx.fillRect(rectX, rectY, blockWidth, Math.max(12, Math.round(titleSize * 0.2)));

      ctx.font = `900 ${titleSize}px "Noto Sans TC", sans-serif`;
      ctx.fillStyle = state.textColor;
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = Math.max(6, Math.round(titleSize * 0.15));
      const lineCount = drawMultilineText(title, t.x, t.y, maxWidth, titleLineHeight);

      if (subtitle) {
        ctx.font = `600 ${subtitleSize}px "Noto Sans TC", sans-serif`;
        ctx.lineWidth = Math.max(4, Math.round(subtitleSize * 0.2));
        ctx.fillStyle = '#f8fafc';
        const subtitleY = t.y + lineCount * titleLineHeight + Math.round(subtitleSize * 0.25);
        ctx.strokeText(subtitle, t.x, subtitleY);
        ctx.fillText(subtitle, t.x, subtitleY);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (state.image) drawCoverImage(state.image);
      else drawFallbackBackground();
      drawOverlay();
      drawText();
    }

    function updateFromInputs() {
      state.format = aspectRatioInput.value;
      state.title = titleInput.value;
      state.subtitle = subtitleInput.value;
      state.textColor = textColorInput.value;
      state.accentColor = accentColorInput.value;
      state.brightness = Number(brightnessInput.value);
      state.contrast = Number(contrastInput.value);
      state.overlay = Number(overlayInput.value);
      state.layout = layoutInput.value;
      applyFormat();
      render();
    }

    function randomizeStyles() {
      const presets = [
        { accent: '#ef4444', text: '#ffffff', overlay: 35, brightness: 105, contrast: 120, layout: 'left' },
        { accent: '#22c55e', text: '#f8fafc', overlay: 45, brightness: 95, contrast: 140, layout: 'right' },
        { accent: '#f59e0b', text: '#ffffff', overlay: 30, brightness: 110, contrast: 115, layout: 'center' },
        { accent: '#a855f7', text: '#fefce8', overlay: 55, brightness: 90, contrast: 150, layout: 'left' }
      ];
      const pick = presets[Math.floor(Math.random() * presets.length)];

      accentColorInput.value = pick.accent;
      textColorInput.value = pick.text;
      overlayInput.value = pick.overlay;
      brightnessInput.value = pick.brightness;
      contrastInput.value = pick.contrast;
      layoutInput.value = pick.layout;
      updateFromInputs();
    }

    photoInput.addEventListener('change', (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        state.image = img;
        state.imageName = file.name.replace(/\.[^/.]+$/, '');
        imageStatus.textContent = `已載入圖片：${file.name}`;
        URL.revokeObjectURL(url);
        render();
      };
      img.onerror = () => {
        imageStatus.textContent = '圖片讀取失敗，請換一張試試看。';
      };
      img.src = url;
    });

    [aspectRatioInput, titleInput, subtitleInput, textColorInput, accentColorInput, brightnessInput, contrastInput, overlayInput, layoutInput]
      .forEach(el => el.addEventListener('input', updateFromInputs));

    randomBtn.addEventListener('click', randomizeStyles);

    downloadBtn.addEventListener('click', () => {
      render();
      const link = document.createElement('a');
      const baseName = state.imageName || 'youtube-cover';
      const formatLabel = state.format === 'portrait' ? '9x16' : '16x9';
      link.download = `${baseName}-${formatLabel}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    applyFormat();
    render();
  </script>
</body>
</html>
